---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes/forge
  - ../../kubernetes/workers/lre-cc
  - ../../kubernetes/resources/gateway-routes

# Note: This deployment is mainly intended for documentation purposes. If you
#       intend to use it you'll need to provide image tags here.
#
#       Forge doesn't support a "latest" tag or similar for reproducibility
#       reasons. For the latest tags see:
#         https://github.com/orgs/TraceMachina/packages?repo_name=forge
#
# See the lre overlay for a setup that autodetects these tags and automatically
# stays in sync with main. See the `../deploy/dev` directory for development
# setups.
images:
  - name: forge
    newName: ghcr.io/toxicwind/forge
    newTag: TODO
  - name: forge-worker-init
    newName: ghcr.io/toxicwind/forge-worker-init
    newTag: TODO
  - name: forge-worker-lre-cc
    newName: ghcr.io/toxicwind/forge-worker-lre-cc
    newTag: TODO
