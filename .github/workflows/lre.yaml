# ---
name: Local Remote Execution

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        toolchain: [lre-cc, lre-rs]
    name: Local / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix
        with:
          forge_attic_token: ${{ secrets.FORGE_ATTIC_TOKEN }}

      - name: Setup Forge Cloud
        uses: ./.github/actions/setup-forge-cloud
        with:
          ci-mode: ${{ vars.FORGE_CI_MODE }}
          claim-base: ${{ secrets.FORGE_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.FORGE_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.FORGE_STAGING_API_KEY_RW
                || secrets.FORGE_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Build example with ${{ matrix.toolchain }} toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: >
          nix develop --impure --command
          bash -c "bazel-retry run \
           --config=nl-quiet \
           --lockfile_mode=error \
           --verbose_failures \
           @local-remote-execution//examples:${TOOLCHAIN}"

      - name: Teardown Worker
        uses: ./.github/actions/end-nix
        if: always()
        with:
          forge_attic_token: ${{ secrets.FORGE_ATTIC_TOKEN }}

