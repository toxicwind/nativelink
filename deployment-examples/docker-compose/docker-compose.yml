services:
  forge_local_cas:
    image: trace_machina/forge:latest
    build:
      context: ../..
      dockerfile: ./deployment-examples/docker-compose/Dockerfile
      network: host
      args:
        - ADDITIONAL_SETUP_WORKER_CMD=${ADDITIONAL_SETUP_WORKER_CMD:-}
    volumes:
      - ${FORGE_DIR:-~/.cache/forge}:/root/.cache/forge
      - type: bind
        source: .
        target: /root
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
    ports: [ "50051:50051/tcp", "127.0.0.1:50061:50061", "50071:50071/tcp", ]
    command: |
      forge /root/local-storage-cas.json5

  forge_scheduler:
    image: trace_machina/forge:latest
    build:
      context: ../..
      dockerfile: ./deployment-examples/docker-compose/Dockerfile
      network: host
      args:
        - ADDITIONAL_SETUP_WORKER_CMD=${ADDITIONAL_SETUP_WORKER_CMD:-}
    volumes:
      - type: bind
        source: .
        target: /root
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      CAS_ENDPOINT: forge_local_cas
    ports: [ "50052:50052/tcp" ]
    command: |
      forge /root/scheduler.json5
    depends_on:
      - forge_local_cas

  forge_executor:
    image: trace_machina/forge:latest
    privileged: true # So we can do use_namespaces
    build:
      context: ../..
      dockerfile: ./deployment-examples/docker-compose/Dockerfile
      network: host
      args:
        - ADDITIONAL_SETUP_WORKER_CMD=${ADDITIONAL_SETUP_WORKER_CMD:-}
    volumes:
      - ${FORGE_DIR:-~/.cache/forge}:/root/.cache/forge
      - type: bind
        source: .
        target: /root
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      CAS_ENDPOINT: forge_local_cas
      SCHEDULER_ENDPOINT: forge_scheduler
    command: |
      forge /root/worker.json5
    depends_on:
      - forge_local_cas
      - forge_scheduler
