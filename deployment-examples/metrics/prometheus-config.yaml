# Prometheus Configuration for Forge Metrics
# This configuration sets up Prometheus to receive metrics via OTLP and scrape format
#
# NOTE: This configuration uses `translation_strategy: NoUTF8EscapingWithSuffixes` which
# adds the `_total` suffix to counter metrics when using OTLP ingestion (Prometheus v3+).
# The included Grafana dashboards use `_total` suffix for counter metrics to match this.
# See README.md for more information on metric naming.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'forge-cluster'
    environment: 'production'

# Enable OTLP receiver (requires --web.enable-otlp-receiver flag)
otlp:
  # Promote Forge-specific resource attributes to labels
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    # Cloud/Infrastructure attributes
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    # Kubernetes attributes
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    # Forge-specific attributes
    - forge.instance_name
    - forge.worker_id
    - forge.scheduler_name

  # Use NoTranslation to preserve metric names with UTF-8 support
  # This keeps OpenTelemetry semantic convention names intact
  translation_strategy: NoUTF8EscapingWithSuffixes

# Scrape configurations
scrape_configs:
  # Scrape the OTEL Collector's Prometheus endpoint
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9090']
    metric_relabel_configs:
      # Add forge prefix to all metrics from collector
      - source_labels: [__name__]
        regex: '(forge_.*)'
        target_label: __name__
        replacement: '${1}'

  # Scrape Prometheus's own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Optional: Direct scrape of Forge instances (if metrics endpoint is exposed)
  # - job_name: 'forge-direct'
  #   static_configs:
  #     - targets: ['forge-cas:8080', 'forge-scheduler:8080']
  #   metrics_path: '/metrics'

# Recording rules for common Forge queries
rule_files:
  - /etc/prometheus/rules/*.yml

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Example recording rules for Forge metrics
# Save this as a separate file: rules/forge-recording-rules.yml
# rule_files content example:
---
# Recording Rules for Forge Metrics
groups:
  - name: forge_execution
    interval: 30s
    rules:
      # Execution success rate
      - record: forge:execution_success_rate
        expr: |
          sum(rate(forge_execution_completed_count_total{execution_result="success"}[5m])) /
          sum(rate(forge_execution_completed_count_total[5m]))

      # Average queue time
      - record: forge:execution_queue_time_avg
        expr: |
          histogram_quantile(0.5,
            sum(rate(forge_execution_queue_time_bucket[5m])) by (le, instance_name)
          )

      # Actions per stage
      - record: forge:execution_active_by_stage
        expr: |
          sum(forge_execution_active_count) by (execution_stage, instance_name)

      # Stage transition rate
      - record: forge:stage_transition_rate
        expr: |
          sum(rate(forge_execution_stage_transitions_total[5m])) by (instance_name)

  - name: forge_cache
    interval: 30s
    rules:
      # Cache hit rate
      - record: forge:cache_hit_rate
        expr: |
          sum(rate(forge_cache_operations_total{cache_operation_result="hit"}[5m])) by (cache_type) /
          sum(rate(forge_cache_operations_total{cache_operation_name="read"}[5m])) by (cache_type)

      # Cache operation latency p95
      - record: forge:cache_operation_latency_p95
        expr: |
          histogram_quantile(0.95,
            sum(rate(forge_cache_operation_duration_bucket[5m])) by (le, cache_type, cache_operation_name)
          )

      # Cache size utilization
      - record: forge:cache_size_bytes
        expr: |
          sum(forge_cache_size) by (cache_type, instance_name)

      # Cache eviction rate
      - record: forge:cache_eviction_rate
        expr: |
          sum(rate(forge_cache_operations_total{cache_operation_name="evict"}[5m])) by (cache_type)

  - name: forge_performance
    interval: 60s
    rules:
      # Overall system throughput
      - record: forge:system_throughput
        expr: |
          sum(rate(forge_execution_completed_count_total[5m]))

      # Worker utilization
      - record: forge:worker_utilization
        expr: |
          sum(forge_execution_active_count{execution_stage="executing"}) by (execution_worker_id) /
          count(count by (execution_worker_id) (forge_execution_active_count))

      # Action completion time (from queued to completed)
      - record: forge:action_total_duration_p99
        expr: |
          histogram_quantile(0.99,
            sum(rate(forge_execution_total_duration_bucket[5m])) by (le, instance_name)
          )
