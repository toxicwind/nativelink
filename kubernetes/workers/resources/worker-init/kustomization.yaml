---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -worker-init

resources:
  - ../../../resources/alert-kustomization

patches:
- patch: |-
    - op: replace
      path: /spec/postBuild/substitute/PLACEHOLDER_FLAKE_OUTPUT
      value: github:toxicwind/forge#forge-worker-init
    - op: replace
      path: /spec/postBuild/substitute/PLACEHOLDER_CONFIG_MAP_NAME
      value: forge-worker-init
    - op: add
      path: /spec/nameSuffix
      value: -worker-init
  target:
    kind: Kustomization
    name: forge-alert
