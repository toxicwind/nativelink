---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -lre-cc

resources:
  - ../../../resources/alert-kustomization

components:
  - ../../../components/kustomization

replacements:
  - source:
      kind: Kustomization
      name: forge
      fieldPath: metadata.name
    targets:
      - select:
          kind: Kustomization
          name: forge-alert
        fieldPaths:
          - spec.postBuild.substitute.PLACEHOLDER_CONFIG_MAP_NAME
      - select:
          kind: Kustomization
          name: forge
        fieldPaths:
          - spec.postBuild.substituteFrom.0.name

patches:
- patch: |-
    - op: replace
      path: /spec/postBuild/substitute/PLACEHOLDER_FLAKE_OUTPUT
      value: github:toxicwind/forge#forge-worker-lre-cc
    - op: add
      path: /spec/nameSuffix
      value: -lre-cc
  target:
    kind: Kustomization
    name: forge-alert
- patch: |-
    - op: replace
      path: /spec/path
      value: ./kubernetes/workers/lre-cc
    - op: add
      path: /spec/postBuild/substituteFrom/1
      value:
        kind: ConfigMap
        name: forge-worker-init
    - op: add
      path: /spec/images
      value:
      - name: forge-worker-init
        newName: localhost:5001/forge-worker-init
        newTag: ${FORGE_WORKER_INIT_TAG}
      - name: forge-worker-lre-cc
        newName: localhost:5001/forge-worker-lre-cc
        newTag: ${FORGE_WORKER_LRE_CC_TAG}
  target:
    kind: Kustomization
    name: forge
