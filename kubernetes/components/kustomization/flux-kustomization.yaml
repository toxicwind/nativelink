---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forge
  namespace: default
spec:
  interval: 2m
  path: PLACEHOLDER_FORGE_KUSTOMIZATION
  prune: true
  force: true
  retryInterval: 20s
  targetNamespace: default
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge
    namespace: default
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: forge-image-tags
