---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: forge-worker
  template:
    metadata:
      labels:
        app: forge-worker
    spec:
      initContainers:
        - name: forge-worker-init
          # This image will be edited by kustomize.
          image: forge-worker-init
          args: ["/shared/forge"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: forge-worker
          # This image will be edited by kustomize.
          image: forge-worker
          env:
            - name: RUST_LOG
              value: info
            - name: FORGE_ENDPOINT
              value: forge
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-collector.default.svc:4317
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: zstd
          volumeMounts:
            - name: worker-config
              mountPath: /worker.json5
              subPath: worker.json5
            - name: shared
              mountPath: /shared
          command: ["/shared/forge"]
          args: ["/worker.json5"]
      volumes:
        - name: shared
          emptyDir: {}
        - name: worker-config
          configMap:
            name: worker
---
apiVersion: v1
kind: Service
metadata:
  name: forge-worker
spec:
  selector:
    app: forge-worker
  clusterIP: None
