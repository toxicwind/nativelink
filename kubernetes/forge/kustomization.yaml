---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - forge.yaml
  - ../resources/insecure-certs

configMapGenerator:
  - name: forge-config
    files:
      - forge-config.json5
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

images:
  - name: forge
