---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -core

resources:
  - ../../resources/alert-kustomization

components:
  - ../../components/kustomization

replacements:
  - source:
      kind: Kustomization
      name: forge
      fieldPath: metadata.name
    targets:
      - select:
          kind: Kustomization
          name: forge-alert
        fieldPaths:
          - spec.postBuild.substitute.PLACEHOLDER_CONFIG_MAP_NAME
      - select:
          kind: Kustomization
          name: forge
        fieldPaths:
          - spec.postBuild.substituteFrom.0.name

patches:
- patch: |-
    - op: replace
      path: /spec/postBuild/substitute/PLACEHOLDER_FLAKE_OUTPUT
      value: github:toxicwind/forge#image
    - op: add
      path: /spec/nameSuffix
      value: -core
  target:
    kind: Kustomization
    name: forge-alert
- patch: |-
    - op: replace
      path: /spec/path
      value: ./kubernetes/forge
    - op: add
      path: /spec/images
      value:
      - name: forge
        newName: localhost:5001/forge
        newTag: ${FORGE_TAG}
  target:
    kind: Kustomization
    name: forge
