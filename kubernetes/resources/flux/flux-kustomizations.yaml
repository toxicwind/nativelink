---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-operator
  namespace: flux-system
spec:
  interval: 2m
  path: "./kubernetes/vendor/tekton-operator"
  prune: true
  force: true
  retryInterval: 20s
  targetNamespace: ci
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge-infra
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-config
  namespace: flux-system
spec:
  interval: 2m
  path: "./kubernetes/resources/tekton-config"
  prune: true
  force: true
  retryInterval: 20s
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge-infra
    namespace: flux-system
  dependsOn:
    - name: tekton-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forge-tekton-resources
  namespace: flux-system
spec:
  interval: 2m
  path: "./kubernetes/resources/tekton"
  prune: true
  force: true
  retryInterval: 20s
  targetNamespace: ci
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge-infra
    namespace: flux-system
  dependsOn:
    - name: tekton-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forge-tekton-deployment-roles
  namespace: flux-system
spec:
  interval: 2m
  path: "./kubernetes/resources/tekton-roles"
  prune: true
  force: true
  retryInterval: 20s
  # Namespace for the forge deployment.
  targetNamespace: default
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge-infra
    namespace: flux-system
  dependsOn:
    - name: forge-tekton-resources
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: provider
  namespace: flux-system
spec:
  interval: 2m
  path: "./kubernetes/resources/provider"
  prune: true
  force: true
  retryInterval: 20s
  targetNamespace: ci
  wait: true
  sourceRef:
    kind: GitRepository
    name: forge-infra
    namespace: flux-system
  dependsOn:
    - name: forge-tekton-resources
